name: Kids A-Z Reader Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Bot Action (start/stop)'
        required: true
        default: 'start'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Script
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
        run: |
          python bot_runner.py
