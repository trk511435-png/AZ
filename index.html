<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Bot - بث مباشر للمتصفح</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        /* إطار عرض المتصفح السحابي */
        .viewer-box {
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .success { background: #065f46; color: #34d399; }
        .error { background: #7f1d1d; color: #f87171; }
        .loading { background: #1e3a8a; color: #60a5fa; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لوحة تحكم AZ Bot</h1>
        <p>مراقبة المتصفح السحابي وهو يسجل الدخول ويقرأ القصص تلقائياً</p>
        
        <button id="runBtn" class="btn" onclick="startBot()">تشغيل الروبوت وقراءة القصص</button>
        
        <div id="status"></div>

        <!-- شاشة عرض المتصفح (عبر البث المباشر أو صور التحديث اللحظي) -->
        <div class="viewer-box">
            <!-- استبدل رابط الـ iframe برابط البث الخاص بسيرفرك أو خدمة الـ VNC المربطة -->
            <iframe id="browserView" src="https://az-sioy.onrender.com/"></iframe>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://az-sioy.onrender.com";

        async function startBot() {
            const btn = document.getElementById("runBtn");
            const statusDiv = document.getElementById("status");

            btn.disabled = true;
            btn.innerText = "جاري التشغيل...";
            statusDiv.style.display = "block";
            statusDiv.className = "loading";
            statusDiv.innerText = "جاري الاتصال بالسيرفر السحابي وفتح المتصفح لحساب سالم (7B)...";

            try {
                const response = await fetch(`${SERVER_URL}/start-bot`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    statusDiv.className = "success";
                    statusDiv.innerText = "✅ " + data.message;
                } else {
                    statusDiv.className = "error";
                    statusDiv.innerText = "❌ حدث خطأ: " + (data.message || "استجابة غير صالحة");
                }
            } catch (error) {
                statusDiv.className = "error";
                statusDiv.innerText = "❌ تعذر الاتصال بالسيرفر. تأكد أن السيرفر يعمل.";
            } finally {
                btn.disabled = false;
                btn.innerText = "تشغيل الروبوت وقراءة القصص";
            }
        }
    </script>

</body>
</html>
